<!doctype html>
<html lang="en" data-theme="adult">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A0A0A" />
    <script>
      // Tema do último perfil ativo E idioma escolhido, ANTES do primeiro
      // paint (sem flash). Lê o ProfileStore (boxing-ai:profiles) e a chave
      // de idioma (boxing-ai:locale) direto do localStorage; qualquer
      // problema → tema adulto (Fight Night) + inglês.
      (function () {
        var theme = 'adult';
        try {
          var locale = localStorage.getItem('boxing-ai:locale');
          if (locale === 'en' || locale === 'pt-BR') {
            document.documentElement.lang = locale;
          }
        } catch (e) {
          /* localStorage indisponível → idioma padrão do <html> */
        }
        try {
          var doc = JSON.parse(localStorage.getItem('boxing-ai:profiles') || 'null');
          if (doc && Array.isArray(doc.profiles)) {
            for (var i = 0; i < doc.profiles.length; i++) {
              var p = doc.profiles[i];
              if (p && p.id === doc.activeProfileId && p.isKid === true) theme = 'kids';
            }
          }
        } catch (e) {
          /* localStorage indisponível/corrompido → tema padrão */
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <meta name="description" content="AI boxing instructor with real-time pose analysis, in English and Brazilian Portuguese" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <title>AI Boxing Instructor</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
