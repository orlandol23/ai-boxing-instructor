<!doctype html>
<html lang="en" data-theme="adult">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A0A0A" />
    <script>
      // Theme of the last active profile AND the chosen language, BEFORE
      // the first paint (no flash). Reads the ProfileStore
      // (boxing-ai:profiles) and the language key (boxing-ai:locale)
      // straight from localStorage; on any problem it falls back to the
      // adult theme (Fight Night) + English.
      (function () {
        var theme = 'adult';
        try {
          var locale = localStorage.getItem('boxing-ai:locale');
          if (locale === 'en' || locale === 'pt-BR') {
            document.documentElement.lang = locale;
          }
        } catch (e) {
          /* localStorage unavailable: the <html> default language wins */
        }
        try {
          var doc = JSON.parse(localStorage.getItem('boxing-ai:profiles') || 'null');
          if (doc && Array.isArray(doc.profiles)) {
            for (var i = 0; i < doc.profiles.length; i++) {
              var p = doc.profiles[i];
              if (p && p.id === doc.activeProfileId && p.isKid === true) theme = 'kids';
            }
          }
        } catch (e) {
          /* localStorage unavailable/corrupted: the default theme wins */
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <meta name="description" content="AI boxing instructor with real-time pose analysis, in English and Brazilian Portuguese" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <title>AI Boxing Instructor</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
